spring.application.name=sb-ecom

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use non-JTA (JDBC) transaction coordinator to avoid requiring a JTA platform
spring.jpa.properties.hibernate.transaction.coordinator_class=jdbc
# Explicitly tell Hibernate there is no JTA platform available
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Automatically update the schema in the dev environment
spring.jpa.hibernate.ddl-auto=update
# Ensure Hibernate uses H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
